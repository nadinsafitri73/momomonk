<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Полка</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #12100e;
    --panel: #1c1916;
    --line: #2e2924;
    --text: #f0ebe3;
    --muted: #9a9186;
    --accent: #e25b45;
    --ok: #d6c07a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.4 "Segoe UI", sans-serif;
  }
  header, .bar, main { width: min(1080px, calc(100% - 32px)); margin: 0 auto; }
  header { padding: 28px 0 8px; }
  h1 { margin: 0; font-size: 28px; font-weight: 650; letter-spacing: -0.03em; }
  #stats { margin: 6px 0 0; color: var(--muted); }
  .bar {
    position: sticky;
    top: 0;
    z-index: 2;
    display: flex;
    flex-wrap: wrap;
    gap: 10px 12px;
    align-items: end;
    padding: 12px 0 14px;
    background: linear-gradient(var(--bg) 70%, transparent);
  }
  label { display: flex; flex-direction: column; gap: 4px; color: var(--muted); font-size: 12px; }
  input, select, button {
    font: inherit;
    color: var(--text);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
  }
  input, select { height: 36px; padding: 0 10px; }
  input[type="search"] { width: 240px; }
  input[type="number"] { width: 88px; }
  button {
    height: 36px;
    padding: 0 12px;
    cursor: pointer;
  }
  button:hover { border-color: #6a6258; }
  button.active { border-color: var(--accent); color: #ffd7cf; }
  .checks { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; min-height: 36px; }
  .checks label { flex-direction: row; align-items: center; gap: 6px; font-size: 13px; color: var(--text); }
  .card {
    display: grid;
    grid-template-columns: 72px 1fr auto;
    gap: 4px 16px;
    padding: 14px 4px;
    border-top: 1px solid var(--line);
  }
  .card.marked { box-shadow: inset 3px 0 0 var(--accent); }
  .rate {
    font-size: 26px;
    font-weight: 650;
    letter-spacing: -0.04em;
    font-variant-numeric: tabular-nums;
  }
  .votes { color: var(--muted); font-size: 12px; }
  .title { font-size: 17px; }
  .sub, .meta { color: var(--muted); }
  .sub { margin-top: 2px; }
  .meta { margin-top: 4px; font-size: 13px; }
  a { color: #e7c27a; text-decoration: none; }
  a:hover { text-decoration: underline; }
  .badge {
    display: inline-block;
    margin-left: 6px;
    padding: 1px 6px;
    border: 1px solid #6a5438;
    border-radius: 999px;
    color: var(--ok);
    font-size: 11px;
    vertical-align: 2px;
  }
  .queue {
    height: 34px;
    white-space: nowrap;
  }
  .queue.on { border-color: var(--ok); color: var(--ok); }
  .pager {
    display: flex;
    gap: 10px;
    align-items: center;
    justify-content: space-between;
    padding: 16px 0 40px;
    color: var(--muted);
  }
  .empty { padding: 40px 0; color: var(--muted); }
  @media (max-width: 720px) {
    .card { grid-template-columns: 56px 1fr; }
    .queue { grid-column: 2; justify-self: start; }
    input[type="search"] { width: 100%; }
  }
</style>
</head>
<body>
<header>
  <h1>Полка</h1>
  <p id="stats"></p>
</header>
<div class="bar">
  <label>поиск
    <input id="q" type="search" placeholder="название, режиссёр, tt…">
  </label>
  <label>рейтинг от
    <input id="min" type="number" min="0" max="10" step="0.1" value="7">
  </label>
  <label>до
    <input id="max" type="number" min="0" max="10" step="0.1" value="10">
  </label>
  <label>голосов от
    <input id="votes" type="number" min="0" step="100" value="0">
  </label>
  <label>год от
    <input id="yearFrom" type="number" min="1900" max="2030" step="1">
  </label>
  <label>до
    <input id="yearTo" type="number" min="1900" max="2030" step="1">
  </label>
  <label>жанр
    <select id="genre"><option value="">все</option></select>
  </label>
  <label>сортировка
    <select id="sort">
      <option value="rating">рейтинг</option>
      <option value="votes">голоса</option>
      <option value="year">год, новые</option>
      <option value="yearAsc">год, старые</option>
      <option value="title">название</option>
    </select>
  </label>
  <div class="checks">
    <button type="button" id="p7" class="active">7–10</button>
    <button type="button" id="p8">8–10</button>
    <button type="button" id="pAll">все оценки</button>
    <button type="button" id="pKnown">7–10, от 5 тыс.</button>
    <label><input id="exactOnly" type="checkbox"> только точные</label>
    <label><input id="unrated" type="checkbox"> без оценки</label>
    <label><input id="untranslated" type="checkbox"> без перевода</label>
    <label><input id="queueOnly" type="checkbox"> очередь</label>
    <button type="button" id="export">скачать список</button>
  </div>
</div>
<main>
  <div id="list"></div>
  <div class="pager">
    <button type="button" id="prev">назад</button>
    <span id="pageLabel"></span>
    <button type="button" id="next">дальше</button>
  </div>
</main>
<script src="movies.js"></script>
<script>
const PAGE = 50;
const movies = (window.MOVIES || []).map((movie) => {
  const names = [...movie.ru, ...movie.en];
  const hay = [
    names.join(" "),
    movie.director || "",
    movie.imdbTitle || "",
    (movie.genres || []).join(" "),
    movie.year || "",
    movie.imdb || "",
    (movie.formats || []).join(" ")
  ].join(" ").toLowerCase();
  return { ...movie, hay, label: movie.ru[0] || movie.en[0] || movie.imdbTitle || "без названия" };
});

const queue = new Set(JSON.parse(localStorage.getItem("shelf-queue") || "[]"));
const state = {
  q: "",
  min: 7,
  max: 10,
  votes: 0,
  yearFrom: "",
  yearTo: "",
  genre: "",
  sort: "rating",
  exactOnly: false,
  unrated: false,
  untranslated: false,
  queueOnly: false,
  page: 0
};

const $ = (id) => document.getElementById(id);

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, (ch) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[ch]));
}

function saveQueue() {
  localStorage.setItem("shelf-queue", JSON.stringify([...queue]));
}

function ratingColor(value) {
  if (value == null) return "#6f6862";
  if (value >= 8) return "#8dcea8";
  if (value >= 7) return "#e0c56a";
  if (value >= 5) return "#d08a4c";
  return "#d06558";
}

function displayTitle(movie) {
  const extra = [...movie.ru, ...movie.en].filter((title) => title !== movie.label);
  if (movie.imdbTitle && !extra.includes(movie.imdbTitle) && movie.imdbTitle !== movie.label) {
    extra.push(movie.imdbTitle);
  }
  return extra;
}

function matches(movie) {
  if (state.q && !state.q.split(/\s+/).every((part) => movie.hay.includes(part))) return false;
  if (movie.rating == null) {
    if (!state.unrated) return false;
  } else if (movie.rating < state.min || movie.rating > state.max + 0.001) {
    return false;
  }
  if (state.votes && (movie.votes || 0) < state.votes) return false;
  if (state.yearFrom && (movie.year || 0) < Number(state.yearFrom)) return false;
  if (state.yearTo && (movie.year || 9999) > Number(state.yearTo)) return false;
  if (state.genre && !(movie.genres || []).includes(state.genre)) return false;
  if (state.exactOnly && movie.confidence !== "ok") return false;
  if (state.untranslated && !movie.noTranslation) return false;
  if (state.queueOnly && !queue.has(movie.id)) return false;
  return true;
}

function compare(a, b) {
  if (state.sort === "votes") return (b.votes || 0) - (a.votes || 0);
  if (state.sort === "year") return (b.year || 0) - (a.year || 0);
  if (state.sort === "yearAsc") return (a.year || 0) - (b.year || 0);
  if (state.sort === "title") return a.label.localeCompare(b.label, "ru");
  return (b.rating ?? -1) - (a.rating ?? -1) || (b.votes || 0) - (a.votes || 0);
}

function current() {
  return movies.filter(matches).sort(compare);
}

function render() {
  const rows = current();
  const pages = Math.max(1, Math.ceil(rows.length / PAGE));
  if (state.page >= pages) state.page = pages - 1;
  if (state.page < 0) state.page = 0;
  const slice = rows.slice(state.page * PAGE, state.page * PAGE + PAGE);
  const rated = movies.filter((movie) => movie.rating != null).length;
  const inRange = movies.filter((movie) => movie.rating != null && movie.rating >= 7 && movie.rating <= 10).length;
  $("stats").textContent = `${movies.length} фильмов в выгрузке · с оценкой ${rated} · от 7 до 10: ${inRange} · сейчас ${rows.length}`;
  if (!slice.length) {
    $("list").innerHTML = '<div class="empty">по этому фильтру пусто</div>';
  } else {
    $("list").innerHTML = slice.map((movie) => {
      const extra = displayTitle(movie);
      const meta = [
        movie.year || "",
        movie.director || "",
        (movie.formats || []).join(", "),
        (movie.genres || []).slice(0, 3).join(", "),
        movie.runtime ? `${movie.runtime} мин` : "",
        movie.noTranslation ? "без перевода" : ""
      ].filter(Boolean).join(" · ");
      const rate = movie.rating == null ? "—" : movie.rating.toFixed(1);
      const link = movie.imdb
        ? `https://www.imdb.com/title/${movie.imdb}/`
        : `https://www.imdb.com/find/?q=${encodeURIComponent(`${movie.label} ${movie.year || ""}`.trim())}`;
      const linkText = movie.imdb ? movie.imdb : "искать на IMDb";
      const weak = movie.confidence === "weak" ? '<span class="badge">неточно</span>' : "";
      const queued = queue.has(movie.id);
      return `<article class="card${movie.marked ? " marked" : ""}">
        <div>
          <div class="rate" style="color:${ratingColor(movie.rating)}">${rate}</div>
          <div class="votes">${movie.votes ? movie.votes.toLocaleString("ru-RU") : ""}</div>
        </div>
        <div>
          <div class="title">${esc(movie.label)}${weak}</div>
          <div class="sub">${esc(extra.join(" · "))}</div>
          <div class="meta">${esc(meta)}</div>
          <div class="meta"><a href="${link}" target="_blank" rel="noopener">${linkText}</a></div>
        </div>
        <button type="button" class="queue${queued ? " on" : ""}" data-id="${movie.id}">${queued ? "в очереди" : "к просмотру"}</button>
      </article>`;
    }).join("");
  }
  $("pageLabel").textContent = rows.length ? `${state.page + 1} / ${pages}` : "0 / 0";
  $("p7").classList.toggle("active", state.min === 7 && state.max === 10 && !state.votes && !state.unrated);
  $("p8").classList.toggle("active", state.min === 8 && state.max === 10 && !state.votes && !state.unrated);
  $("pAll").classList.toggle("active", state.min === 0 && state.max === 10 && state.unrated && !state.votes);
  $("pKnown").classList.toggle("active", state.min === 7 && state.max === 10 && state.votes === 5000 && !state.unrated);
}

function readControls() {
  state.q = $("q").value.trim().toLowerCase();
  state.min = Number($("min").value || 0);
  state.max = Number($("max").value || 10);
  if (state.min > state.max) [state.min, state.max] = [state.max, state.min];
  state.votes = Number($("votes").value || 0);
  state.yearFrom = $("yearFrom").value;
  state.yearTo = $("yearTo").value;
  state.genre = $("genre").value;
  state.sort = $("sort").value;
  state.exactOnly = $("exactOnly").checked;
  state.unrated = $("unrated").checked;
  state.untranslated = $("untranslated").checked;
  state.queueOnly = $("queueOnly").checked;
  state.page = 0;
  render();
}

function setPreset(min, max, votes, unrated) {
  state.min = min;
  state.max = max;
  state.votes = votes;
  state.unrated = unrated;
  $("min").value = min;
  $("max").value = max;
  $("votes").value = votes;
  $("unrated").checked = unrated;
  state.page = 0;
  render();
}

const genres = new Set();
movies.forEach((movie) => (movie.genres || []).forEach((genre) => genres.add(genre)));
[...genres].sort((a, b) => a.localeCompare(b)).forEach((genre) => {
  const option = document.createElement("option");
  option.value = genre;
  option.textContent = genre;
  $("genre").appendChild(option);
});

["q", "min", "max", "votes", "yearFrom", "yearTo", "genre", "sort", "exactOnly", "unrated", "untranslated", "queueOnly"]
  .forEach((id) => $(id).addEventListener("input", readControls));

$("p7").onclick = () => setPreset(7, 10, 0, false);
$("p8").onclick = () => setPreset(8, 10, 0, false);
$("pAll").onclick = () => setPreset(0, 10, 0, true);
$("pKnown").onclick = () => setPreset(7, 10, 5000, false);
$("prev").onclick = () => { state.page -= 1; render(); };
$("next").onclick = () => { state.page += 1; render(); };
$("list").onclick = (event) => {
  const button = event.target.closest("button[data-id]");
  if (!button) return;
  const id = Number(button.dataset.id);
  if (queue.has(id)) queue.delete(id);
  else queue.add(id);
  saveQueue();
  render();
};
$("export").onclick = () => {
  const lines = current().map((movie) => {
    const link = movie.imdb ? `https://www.imdb.com/title/${movie.imdb}/` : "";
    return [movie.rating ?? "", movie.year ?? "", movie.label, movie.en[0] || "", link].join("\t");
  });
  const blob = new Blob([lines.join("\n")], { type: "text/plain;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const anchor = document.createElement("a");
  anchor.href = url;
  anchor.download = "polka.txt";
  anchor.click();
  URL.revokeObjectURL(url);
};

if (!window.MOVIES) {
  $("stats").textContent = "нет movies.js — сначала прогони enrich_imdb.py";
} else {
  render();
}
</script>
</body>
</html>
