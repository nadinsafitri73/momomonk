<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Полка</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #12100e;
    --panel: #1c1916;
    --line: #2e2924;
    --text: #f0ebe3;
    --muted: #9a9186;
    --accent: #e25b45;
    --ok: #d6c07a;
    --pager: 58px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.4 "Segoe UI", sans-serif;
  }
  header, .bar, main { width: min(1080px, calc(100% - 28px)); margin: 0 auto; }
  header { padding: 22px 0 4px; }
  .head-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  h1 { margin: 0; font-size: 28px; font-weight: 650; letter-spacing: -0.03em; }
  #stats { margin: 6px 0 0; color: var(--muted); font-size: 14px; }
  #filters {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 12px;
    align-items: end;
    padding: 12px 0 4px;
  }
  label { display: flex; flex-direction: column; gap: 4px; color: var(--muted); font-size: 12px; min-width: 0; }
  input, select, button {
    font: inherit;
    color: var(--text);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
  }
  input, select { height: 40px; padding: 0 10px; font-size: 16px; }
  input[type="search"] { width: 240px; }
  input[type="number"] { width: 96px; }
  button { height: 40px; padding: 0 12px; cursor: pointer; }
  button:hover { border-color: #6a6258; }
  button:disabled { opacity: 0.4; cursor: default; }
  button.active { border-color: var(--accent); color: #ffd7cf; }
  .checks { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
  .checks label { flex-direction: row; align-items: center; gap: 6px; font-size: 14px; color: var(--text); }
  .pager {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    justify-content: space-between;
    color: var(--muted);
  }
  .pager-top {
    position: sticky;
    top: 0;
    z-index: 4;
    padding: 8px 0;
    background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
  }
  .pager-bottom { padding: 18px 0 calc(28px + env(safe-area-inset-bottom)); }
  .pager-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .pager button { min-width: 44px; height: 44px; }
  .jump-wrap {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 8px;
    color: var(--text);
    font-size: 14px;
  }
  .jump { width: 72px; height: 44px; text-align: center; }
  .pager-meta { font-size: 14px; }
  #list { scroll-margin-top: 76px; }
  .card {
    display: grid;
    grid-template-columns: 72px 1fr auto;
    gap: 4px 16px;
    padding: 14px 2px;
    border-bottom: 1px solid var(--line);
  }
  .card.marked { box-shadow: inset 3px 0 0 var(--accent); }
  .rate {
    font-size: 26px;
    font-weight: 650;
    letter-spacing: -0.04em;
    font-variant-numeric: tabular-nums;
  }
  .votes { color: var(--muted); font-size: 12px; }
  .title, .sub, .meta { overflow-wrap: break-word; }
  .title { font-size: 17px; }
  .sub, .meta { color: var(--muted); }
  .sub { margin-top: 2px; }
  .meta { margin-top: 4px; font-size: 13px; }
  a { color: #e7c27a; text-decoration: none; }
  a:hover { text-decoration: underline; }
  .title a { color: inherit; }
  .title a:hover { color: #e7c27a; }
  .badge {
    display: inline-block;
    margin-left: 6px;
    padding: 1px 6px;
    border: 1px solid #6a5438;
    border-radius: 999px;
    color: var(--ok);
    font-size: 11px;
    vertical-align: 2px;
  }
  .queue { height: 40px; white-space: nowrap; }
  .queue.on { border-color: var(--ok); color: var(--ok); }
  .more { padding: 18px 0; color: var(--muted); text-align: center; }
  .empty { padding: 40px 0; color: var(--muted); }
  #filterToggle { display: none; }
  @media (max-width: 800px) {
    header, .bar, main { width: min(1080px, calc(100% - 20px)); }
    h1 { font-size: 24px; }
    #filterToggle { display: inline-flex; align-items: center; }
    #filters { display: none; }
    #filters.open { display: flex; }
    #filters > label { flex: 1 1 100%; }
    #filters > label input, #filters > label select { width: 100%; }
    .checks {
      display: grid;
      grid-template-columns: 1fr 1fr;
      width: 100%;
      align-items: center;
    }
    .checks > button { width: 100%; }
    #export { grid-column: 1 / -1; }
    .checks label { flex-direction: row; width: auto; }
    .checks input[type="checkbox"] { width: 22px; height: 22px; margin: 0; flex: none; }
    .card { grid-template-columns: 56px 1fr; gap: 6px 12px; padding: 16px 0; }
    .queue { grid-column: 1 / -1; width: 100%; height: 44px; }
    .pager-actions {
      display: grid;
      grid-template-columns: minmax(76px, auto) minmax(0, 1fr) minmax(76px, auto);
      width: 100%;
      align-items: center;
    }
    #filterToggle, .pager-bottom [data-act="top"] { grid-column: 1 / -1; }
    .pager-actions button { width: 100%; }
    .jump-wrap { justify-content: center; }
    .jump { width: 64px; }
    .pager-meta { width: 100%; }
  }
</style>
</head>
<body>
<header>
  <div class="head-row">
    <h1>Полка</h1>
  </div>
  <p id="stats"></p>
</header>
<div class="bar">
  <div id="filters">
    <label>поиск
      <input id="q" type="search" placeholder="название, режиссёр, tt…" enterkeyhint="search">
    </label>
    <label>рейтинг от
      <input id="min" type="number" inputmode="decimal" min="0" max="10" step="0.1" value="7">
    </label>
    <label>до
      <input id="max" type="number" inputmode="decimal" min="0" max="10" step="0.1" value="10">
    </label>
    <label>голосов от
      <input id="votes" type="number" inputmode="numeric" min="0" step="100" value="0">
    </label>
    <label>год от
      <input id="yearFrom" type="number" inputmode="numeric" min="1900" max="2030" step="1">
    </label>
    <label>до
      <input id="yearTo" type="number" inputmode="numeric" min="1900" max="2030" step="1">
    </label>
    <label>жанр
      <select id="genre"><option value="">все</option></select>
    </label>
    <label>сортировка
      <select id="sort">
        <option value="rating">рейтинг</option>
        <option value="votes">голоса</option>
        <option value="year">год, новые</option>
        <option value="yearAsc">год, старые</option>
        <option value="title">название</option>
      </select>
    </label>
    <div class="checks">
      <button type="button" id="p7" class="active">7–10</button>
      <button type="button" id="p8">8–10</button>
      <button type="button" id="pAll">все оценки</button>
      <button type="button" id="pKnown">7–10, от 5 тыс.</button>
      <label><input id="exactOnly" type="checkbox"> только точные</label>
      <label><input id="unrated" type="checkbox"> без оценки</label>
      <label><input id="untranslated" type="checkbox"> без перевода</label>
      <label><input id="queueOnly" type="checkbox"> очередь</label>
      <button type="button" id="export">скачать список</button>
    </div>
  </div>
  <nav class="pager pager-top" data-pager>
    <div class="pager-actions">
      <button type="button" id="filterToggle">фильтры</button>
      <button type="button" data-act="prev">назад</button>
      <label class="jump-wrap">стр.
        <input class="jump" data-act="jump" type="number" inputmode="numeric" min="1" value="1">
        <span data-total>из 1</span>
      </label>
      <button type="button" data-act="next">дальше</button>
    </div>
    <span class="pager-meta" data-meta></span>
  </nav>
</div>
<main>
  <div id="list"></div>
  <div id="more" class="more"></div>
  <nav class="pager pager-bottom" data-pager>
    <div class="pager-actions">
      <button type="button" data-act="prev">назад</button>
      <label class="jump-wrap">стр.
        <input class="jump" data-act="jump" type="number" inputmode="numeric" min="1" value="1">
        <span data-total>из 1</span>
      </label>
      <button type="button" data-act="next">дальше</button>
      <button type="button" data-act="top">наверх</button>
    </div>
    <span class="pager-meta" data-meta></span>
  </nav>
</main>
<script src="movies.js"></script>
<script>
const CHUNK = 30;
const movies = (window.MOVIES || []).map((movie) => {
  const names = [...movie.ru, ...movie.en];
  const hay = [
    names.join(" "),
    movie.director || "",
    movie.imdbTitle || "",
    (movie.genres || []).join(" "),
    movie.year || "",
    movie.imdb || "",
    (movie.formats || []).join(" ")
  ].join(" ").toLowerCase();
  return { ...movie, hay, label: movie.ru[0] || movie.en[0] || movie.imdbTitle || "без названия" };
});
const ratedCount = movies.filter((movie) => movie.rating != null).length;
const ge7 = movies.filter((movie) => movie.rating != null && movie.rating >= 7 && movie.rating <= 10).length;

const queue = new Set(JSON.parse(localStorage.getItem("shelf-queue") || "[]"));
const state = {
  q: "",
  min: 7,
  max: 10,
  votes: 0,
  yearFrom: "",
  yearTo: "",
  genre: "",
  sort: "rating",
  exactOnly: false,
  unrated: false,
  untranslated: false,
  queueOnly: false,
  page: 0,
  extra: 0
};
let view = [];
let filling = false;

const $ = (id) => document.getElementById(id);

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, (ch) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[ch]));
}

function saveQueue() {
  localStorage.setItem("shelf-queue", JSON.stringify([...queue]));
}

function ratingColor(value) {
  if (value == null) return "#6f6862";
  if (value >= 8) return "#8dcea8";
  if (value >= 7) return "#e0c56a";
  if (value >= 5) return "#d08a4c";
  return "#d06558";
}

function displayTitle(movie) {
  const extra = [...movie.ru, ...movie.en].filter((title) => title !== movie.label);
  if (movie.imdbTitle && !extra.includes(movie.imdbTitle) && movie.imdbTitle !== movie.label) extra.push(movie.imdbTitle);
  return extra;
}

function matches(movie) {
  if (state.q && !state.q.split(/\s+/).filter(Boolean).every((part) => movie.hay.includes(part))) return false;
  if (movie.rating == null) {
    if (!state.unrated) return false;
  } else if (movie.rating < state.min || movie.rating > state.max + 0.001) {
    return false;
  }
  if (state.votes && (movie.votes || 0) < state.votes) return false;
  if (state.yearFrom && (movie.year || 0) < Number(state.yearFrom)) return false;
  if (state.yearTo && (movie.year || 9999) > Number(state.yearTo)) return false;
  if (state.genre && !(movie.genres || []).includes(state.genre)) return false;
  if (state.exactOnly && movie.confidence !== "ok") return false;
  if (state.untranslated && !movie.noTranslation) return false;
  if (state.queueOnly && !queue.has(movie.id)) return false;
  return true;
}

function compare(a, b) {
  if (state.sort === "votes") return (b.votes || 0) - (a.votes || 0);
  if (state.sort === "year") return (b.year || 0) - (a.year || 0);
  if (state.sort === "yearAsc") return (a.year || 0) - (b.year || 0);
  if (state.sort === "title") return a.label.localeCompare(b.label, "ru");
  return (b.rating ?? -1) - (a.rating ?? -1) || (b.votes || 0) - (a.votes || 0);
}

function endIndex() {
  return (state.page + 1 + state.extra) * CHUNK;
}

function pageCount() {
  return Math.max(1, Math.ceil(view.length / CHUNK));
}

function cardHTML(movie) {
  const extra = displayTitle(movie);
  const meta = [
    movie.year || "",
    movie.director || "",
    (movie.formats || []).join(", "),
    (movie.genres || []).slice(0, 3).join(", "),
    movie.runtime ? `${movie.runtime} мин` : "",
    movie.noTranslation ? "без перевода" : ""
  ].filter(Boolean).join(" · ");
  const rate = movie.rating == null ? "—" : movie.rating.toFixed(1);
  const link = movie.imdb
    ? `https://www.imdb.com/title/${movie.imdb}/`
    : `https://www.imdb.com/find/?q=${encodeURIComponent(`${movie.label} ${movie.year || ""}`.trim())}`;
  const weak = movie.confidence === "weak" ? '<span class="badge">неточно</span>' : "";
  const queued = queue.has(movie.id);
  return `<article class="card${movie.marked ? " marked" : ""}">
    <div>
      <div class="rate" style="color:${ratingColor(movie.rating)}">${rate}</div>
      <div class="votes">${movie.votes ? movie.votes.toLocaleString("ru-RU") : ""}</div>
    </div>
    <div>
      <div class="title"><a href="${link}" target="_blank" rel="noopener">${esc(movie.label)}</a>${weak}</div>
      <div class="sub">${esc(extra.join(" · "))}</div>
      <div class="meta">${esc(meta)}</div>
    </div>
    <button type="button" class="queue${queued ? " on" : ""}" data-id="${movie.id}">${queued ? "в очереди" : "к просмотру"}</button>
  </article>`;
}

function paintPagers() {
  const pages = pageCount();
  const from = view.length ? state.page * CHUNK + 1 : 0;
  const to = Math.min(view.length, endIndex());
  const meta = view.length ? `${from}–${to} из ${view.length}` : "пусто";
  document.querySelectorAll("[data-pager]").forEach((pager) => {
    const jump = pager.querySelector("[data-act=jump]");
    if (document.activeElement !== jump) jump.value = String(state.page + 1);
    jump.max = String(pages);
    pager.querySelector("[data-total]").textContent = `из ${pages}`;
    pager.querySelector("[data-meta]").textContent = meta;
    pager.querySelector("[data-act=prev]").disabled = state.page <= 0;
    pager.querySelector("[data-act=next]").disabled = to >= view.length;
  });
  const more = $("more");
  const done = to >= view.length || !view.length;
  more.hidden = done;
  more.textContent = done ? "" : "листай, подгружаю дальше";
}

function paintPresets() {
  $("p7").classList.toggle("active", state.min === 7 && state.max === 10 && !state.votes && !state.unrated);
  $("p8").classList.toggle("active", state.min === 8 && state.max === 10 && !state.votes && !state.unrated);
  $("pAll").classList.toggle("active", state.min === 0 && state.max === 10 && state.unrated && !state.votes);
  $("pKnown").classList.toggle("active", state.min === 7 && state.max === 10 && state.votes === 5000 && !state.unrated);
}

function renderList(scrollMode) {
  const start = state.page * CHUNK;
  const slice = view.slice(start, endIndex());
  $("list").innerHTML = slice.length ? slice.map(cardHTML).join("") : '<div class="empty">по этому фильтру пусто</div>';
  $("stats").textContent = `${movies.length} фильмов · с оценкой ${ratedCount} · от 7 до 10: ${ge7} · сейчас ${view.length}`;
  paintPagers();
  paintPresets();
  if (scrollMode === "top") {
    const y = $("list").getBoundingClientRect().top + window.scrollY - 72;
    window.scrollTo({ top: Math.max(0, y), behavior: "smooth" });
  }
}

function rebuild(scrollMode) {
  view = movies.filter(matches).sort(compare);
  const pages = pageCount();
  if (state.page >= pages) state.page = pages - 1;
  if (state.page < 0) state.page = 0;
  renderList(scrollMode);
}

function loadMore() {
  if (filling || !view.length || endIndex() >= view.length) return;
  filling = true;
  const from = endIndex();
  state.extra += 1;
  const slice = view.slice(from, endIndex());
  if (slice.length) $("list").insertAdjacentHTML("beforeend", slice.map(cardHTML).join(""));
  paintPagers();
  filling = false;
  if (!$("more").hidden && $("more").getBoundingClientRect().top < window.innerHeight + 800) loadMore();
}

function go(page) {
  const pages = pageCount();
  state.page = Math.min(Math.max(0, page), pages - 1);
  state.extra = 0;
  renderList("top");
}

function readControls() {
  state.q = $("q").value.trim().toLowerCase();
  state.min = Number($("min").value || 0);
  state.max = Number($("max").value || 10);
  if (state.min > state.max) [state.min, state.max] = [state.max, state.min];
  state.votes = Number($("votes").value || 0);
  state.yearFrom = $("yearFrom").value;
  state.yearTo = $("yearTo").value;
  state.genre = $("genre").value;
  state.sort = $("sort").value;
  state.exactOnly = $("exactOnly").checked;
  state.unrated = $("unrated").checked;
  state.untranslated = $("untranslated").checked;
  state.queueOnly = $("queueOnly").checked;
  state.page = 0;
  state.extra = 0;
  const away = $("list").getBoundingClientRect().top < 0;
  rebuild(away ? "top" : undefined);
}

function setPreset(min, max, votes, unrated) {
  state.min = min;
  state.max = max;
  state.votes = votes;
  state.unrated = unrated;
  $("min").value = min;
  $("max").value = max;
  $("votes").value = votes;
  $("unrated").checked = unrated;
  state.page = 0;
  state.extra = 0;
  rebuild("top");
}

const genres = new Set();
movies.forEach((movie) => (movie.genres || []).forEach((genre) => genres.add(genre)));
[...genres].sort((a, b) => a.localeCompare(b)).forEach((genre) => {
  const option = document.createElement("option");
  option.value = genre;
  option.textContent = genre;
  $("genre").appendChild(option);
});

["q", "min", "max", "votes", "yearFrom", "yearTo", "genre", "sort", "exactOnly", "unrated", "untranslated", "queueOnly"]
  .forEach((id) => $(id).addEventListener("input", readControls));

$("p7").onclick = () => setPreset(7, 10, 0, false);
$("p8").onclick = () => setPreset(8, 10, 0, false);
$("pAll").onclick = () => setPreset(0, 10, 0, true);
$("pKnown").onclick = () => setPreset(7, 10, 5000, false);
$("filterToggle").onclick = () => {
  $("filters").classList.toggle("open");
  $("filterToggle").classList.toggle("active", $("filters").classList.contains("open"));
};

document.body.addEventListener("click", (event) => {
  const act = event.target.closest("[data-act]");
  if (!act || act.disabled) return;
  if (act.dataset.act === "prev") go(state.page - 1);
  if (act.dataset.act === "next") go(state.page + state.extra + 1);
  if (act.dataset.act === "top") window.scrollTo({ top: 0, behavior: "smooth" });
});
document.body.addEventListener("change", (event) => {
  if (event.target.dataset.act !== "jump") return;
  const page = Number(event.target.value) || 1;
  go(page - 1);
});

$("list").onclick = (event) => {
  const button = event.target.closest("button[data-id]");
  if (!button) return;
  const id = Number(button.dataset.id);
  if (queue.has(id)) queue.delete(id);
  else queue.add(id);
  saveQueue();
  if (state.queueOnly) {
    state.extra = 0;
    rebuild();
    return;
  }
  const on = queue.has(id);
  button.classList.toggle("on", on);
  button.textContent = on ? "в очереди" : "к просмотру";
};

$("export").onclick = () => {
  const lines = view.map((movie) => {
    const link = movie.imdb ? `https://www.imdb.com/title/${movie.imdb}/` : "";
    return [movie.rating ?? "", movie.year ?? "", movie.label, movie.en[0] || "", link].join("\t");
  });
  const blob = new Blob([lines.join("\n")], { type: "text/plain;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const anchor = document.createElement("a");
  anchor.href = url;
  anchor.download = "polka.txt";
  anchor.click();
  URL.revokeObjectURL(url);
};

const observer = new IntersectionObserver((entries) => {
  if (entries.some((entry) => entry.isIntersecting)) loadMore();
}, { rootMargin: "700px 0px" });
observer.observe($("more"));

if (!window.MOVIES) {
  $("stats").textContent = "нет movies.js — сначала прогони enrich_imdb.py";
} else {
  rebuild();
}
</script>
</body>
</html>
